<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додати Угоду</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Додати Угоду</h1>
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="open_date" class="form-label">Дата відкриття</label>
                    <input type="date" id="open_date" name="open_date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="open_time" class="form-label">Час відкриття</label>
                    <input type="time" id="open_time" name="open_time" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="close_date" class="form-label">Дата закриття</label>
                    <input type="date" id="close_date" name="close_date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="close_time" class="form-label">Час закриття</label>
                    <input type="time" id="close_time" name="close_time" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="symbol" class="form-label">Інструмент</label>
                <input type="text" id="symbol" name="symbol" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="direction" class="form-label">Напрямок</label>
                <select id="direction" name="direction" class="form-control" required>
                    <option value="Buy">Buy</option>
                    <option value="Sell">Sell</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="open_price" class="form-label">Ціна відкриття</label>
                <input type="number" step="0.0001" id="open_price" name="open_price" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="close_price" class="form-label">Ціна закриття</label>
                <input type="number" step="0.0001" id="close_price" name="close_price" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="commission" class="form-label">Комісія</label>
                <input type="number" step="0.0001" id="commission" name="commission" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="result" class="form-label">Результат</label>
                <input type="number" step="0.01" id="result" name="result" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="comment" class="form-label">Коментар</label>
                <textarea id="comment" name="comment" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Зберегти угоду</button>
        </form>
    </div>
</body>
</html>
