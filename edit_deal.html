<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагувати угоду</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Редагувати угоду</h1>
        <form method="POST">
            <div class="mb-3">
                <label for="open_date" class="form-label">Дата відкриття</label>
                <input type="date" class="form-control" id="open_date" name="open_date" value="{{ deal.open_date }}" required>
            </div>
            <div class="mb-3">
                <label for="open_time" class="form-label">Час відкриття</label>
                <input type="time" class="form-control" id="open_time" name="open_time" value="{{ deal.open_time }}" required>
            </div>
            <div class="mb-3">
                <label for="close_date" class="form-label">Дата закриття</label>
                <input type="date" class="form-control" id="close_date" name="close_date" value="{{ deal.close_date }}" required>
            </div>
            <div class="mb-3">
                <label for="close_time" class="form-label">Час закриття</label>
                <input type="time" class="form-control" id="close_time" name="close_time" value="{{ deal.close_time }}" required>
            </div>
            <div class="mb-3">
                <label for="symbol" class="form-label">Інструмент</label>
                <input type="text" class="form-control" id="symbol" name="symbol" value="{{ deal.symbol }}" required>
            </div>
            <div class="mb-3">
                <label for="direction" class="form-label">Напрямок</label>
                <select class="form-select" id="direction" name="direction" required>
                    <option value="Buy" {% if deal.direction == 'Buy' %}selected{% endif %}>Buy</option>
                    <option value="Sell" {% if deal.direction == 'Sell' %}selected{% endif %}>Sell</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="open_price" class="form-label">Ціна відкриття</label>
                <input type="number" step="0.0001" class="form-control" id="open_price" name="open_price" value="{{ deal.open_price }}" required>
            </div>
            <div class="mb-3">
                <label for="close_price" class="form-label">Ціна закриття</label>
                <input type="number" step="0.0001" class="form-control" id="close_price" name="close_price" value="{{ deal.close_price }}" required>
            </div>
            <div class="mb-3">
                <label for="commission" class="form-label">Комісія</label>
                <input type="number" step="0.01" class="form-control" id="commission" name="commission" value="{{ deal.commission }}" required>
            </div>
            <div class="mb-3">
                <label for="result" class="form-label">Результат</label>
                <input type="number" step="0.01" class="form-control" id="result" name="result" value="{{ deal.result }}" required>
            </div>
            <div class="mb-3">
                <label for="comment" class="form-label">Коментар</label>
                <textarea class="form-control" id="comment" name="comment">{{ deal.comment }}</textarea>
            </div>
            <button type="submit" class="btn btn-success">Зберегти</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Скасувати</a>
        </form>
    </div>
</body>
</html>
